[project]
name = "rover_mujoco"
version = "0.1.0"
description = "RL Rover setup for MuJoCo and Gymnasium"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.1.0",
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.3.0",
    "tensorboard>=2.15.0",
    "numpy>=1.24.0,<2.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "onshape-to-robot>=1.8.3",
    "better-actuator-models>=1.0.2",
    "huggingface-hub>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envs"]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "ty>=0.0.78",
]
